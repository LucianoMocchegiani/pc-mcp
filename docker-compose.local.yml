services:
  migrate:
    image: agent-runtime-migrate:local
    build:
      context: ${AGENT_RUNTIME_SRC:-../agent-runtime}
      target: migrate

  agent-runtime:
    image: agent-runtime:local
    build:
      context: ${AGENT_RUNTIME_SRC:-../agent-runtime}
      target: api
    develop:
      watch:
        - path: ${AGENT_RUNTIME_SRC:-../agent-runtime}/apps/api
          action: rebuild
          ignore: [node_modules/, dist/]
        - path: ${AGENT_RUNTIME_SRC:-../agent-runtime}/apps/ui
          action: rebuild
          ignore: [node_modules/, dist/]
        - path: ${AGENT_RUNTIME_SRC:-../agent-runtime}/packages
          action: rebuild
          ignore: [node_modules/, dist/]
        - path: ${AGENT_RUNTIME_SRC:-../agent-runtime}/packages/memory
          action: rebuild
          ignore: [node_modules/, dist/]